apiVersion: 1

contactPoints:
  - orgId: 1
    name: task-reloader-email
    receivers:
      - uid: task-reloader-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $GRAFANA_ALERT_EMAIL_TO
          singleEmail: false

policies:
  - orgId: 1
    receiver: task-reloader-email
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

apiVersion: 1

groups:
  - orgId: 1
    name: task-reloader-operational
    folder: Task Reloader
    interval: 1m
    rules:
      - uid: task-reloader-api-down
        title: API Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max(up{job="task-reloader-api"})
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: replaceNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        annotations:
          summary: API scrape target is down.
          description: Prometheus cannot scrape task-reloader-api for more than 3 minutes.
        labels:
          category: availability
          service: task-reloader-api
          severity: critical

      - uid: task-reloader-5xx-error-rate-high
        title: 5xx Error Rate High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                (
                  100 *
                  sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*|/healthz|/favicon.ico",status=~"5.."}[5m]))
                  /
                  clamp_min(sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*|/healthz|/favicon.ico"}[5m])), 0.000001)
                )
                and
                (
                  sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*|/healthz|/favicon.ico"}[5m])) > 0.02
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: replaceNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: API 5xx error rate is high.
          description: API 5xx error rate is above 10% for 10 minutes while request traffic is present.
        labels:
          category: errors
          service: task-reloader-api
          severity: critical

      - uid: task-reloader-p95-latency-high
        title: p95 Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |
                histogram_quantile(
                  0.95,
                  sum(rate(http_server_requests_seconds_bucket{uri!~"/actuator.*|/healthz|/favicon.ico"}[5m])) by (le)
                )
                and
                (
                  sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*|/healthz|/favicon.ico"}[5m])) > 0.02
                )
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings:
                mode: replaceNN
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: API p95 latency is high.
          description: API p95 latency is above 2 seconds for 15 minutes while request traffic is present.
        labels:
          category: latency
          service: task-reloader-api
          severity: warning
